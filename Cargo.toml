[workspace]
resolver = "2"
members = [
    "crates/arb-core",
    "crates/arb-strategy",
    "crates/arb-engine",
    "crates/arb-runner",
]

[workspace.package]
version = "0.4.5"
edition = "2021"
authors = ["Antigravity Arbitrage Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
arb-core = { path = "crates/arb-core" }
arb-strategy = { path = "crates/arb-strategy" }
arb-engine = { path = "crates/arb-engine" }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async & Runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Numeric & Financial math
rust_decimal = { version = "1.35", features = ["serde", "maths"] }
rust_decimal_macros = "1.35"

# Time & Clocks
chrono = { version = "0.4", features = ["serde"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive", "env"] }

# Networking & Cryptography
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rmp-serde = "1.3"
