name: Build Linux AMD64 Binary

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux amd64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binary
        run: cargo build --release -p arb-runner --target x86_64-unknown-linux-gnu

      - name: Verify Binary
        run: |
          ls -lh target/x86_64-unknown-linux-gnu/release/arb
          file target/x86_64-unknown-linux-gnu/release/arb
          ./target/x86_64-unknown-linux-gnu/release/arb --help

      - name: Prepare Artifact Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/arb dist/arb
          chmod +x dist/arb
          cp -r config dist/
          cp README.md dist/
          tar -czvf arb-linux-amd64.tar.gz -C dist .
          cp target/x86_64-unknown-linux-gnu/release/arb arb-linux-amd64

      - name: Upload Binary Artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: arb-linux-amd64-package
          path: arb-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: arb-linux-amd64-binary
          path: arb-linux-amd64
          if-no-files-found: error

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arb-linux-amd64.tar.gz
            arb-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
