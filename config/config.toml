[engine]
dry_run = false
wal_dir = "data/wal"
log_level = "info"

[strategy]
symbol_hl = "xyz:SKHY"
symbol_bn = "SKHYUSDT"
execution_mode = "bn_maker_hl_taker"
adaptive_baseline = false
ema_tau_secs = 7200
adaptive_entry_delta_bps = 5.0
adaptive_exit_delta_bps = 4.0
entry_spread_bps = 30.0
exit_spread_bps = 20.0
# 反向套利（Mode 2：基差收窄/倒挂做多基差，Long BN Maker + Short HL Taker）
enable_reverse_arb = true
reverse_entry_spread_bps = 5.0
reverse_exit_spread_bps = 18.0
adaptive_reverse_entry_delta_bps = 14.0
adaptive_reverse_exit_delta_bps = 1.0
# 指定每边下单参数（二选一）：
# 1) order_chunk_notional_usd: 每边下单金额 (USDT/USD)，策略根据市价自动换算为币数 (如 100 USDT)
# order_chunk_notional_usd = 100.0
# 2) order_chunk_qty: 每边下单的固定币数 (若未设置 notional_usd 则使用此项)
order_chunk_qty = 0.1
max_position_qty = 1.0
# HL Taker 吃单滑点保护（市价单强吃模式：直接给足 200 bps / 2% 滑点，保证第一下 100% 吃单成功，消除 ZeroFill 拒单）
hl_slippage_bps = 200.0
hl_retry_slippages_bps = [200.0, 300.0, 500.0]
hl_tick_size = 0.01
hl_step_size = 0.01
bn_step_size = 0.01
roundtrip_fees_bps = 1.72
reprice_cooldown_ms = 150
max_quote_dist_ticks = 3
extreme_jump_bps = 12.0
stale_quote_ms = 10000

[risk]
max_position_qty = 3.0
max_order_chunk_qty = 0.1
max_unhedged_qty = 1.0
max_drawdown_usdt = 500.0
max_consecutive_failures = 3
cooldown_ms = 1000

[venues.binance]
api_key = "ENV_BINANCE_API_KEY"
api_secret = "ENV_BINANCE_API_SECRET"
rest_url = "https://fapi.binance.com"
ws_url = "wss://fstream.binance.com/ws"

[venues.hyperliquid]
private_key = "ENV_HL_PRIVATE_KEY"
wallet_address = "ENV_HL_WALLET_ADDRESS"
rest_url = "https://api.hyperliquid.xyz"
ws_url = "wss://api.hyperliquid.xyz/ws"
is_mainnet = true
